version: 2.1

# Validation uniquement : aucun deploiement ni secret CircleCI requis.
jobs:
  verify:
    docker:
      - image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
    resource_class: medium
    retention:
      caches: 7d
    environment:
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - checkout
      - run:
          name: Historique complet et verification des secrets
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              timeout --kill-after=30s 5m git fetch --unshallow origin
            fi
            timeout --kill-after=30s 5m git fetch origin '+refs/heads/main:refs/remotes/origin/main'
            archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            timeout --kill-after=30s 3m curl --fail --silent --show-error --location --output "/tmp/${archive}" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
            echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
            tar -xzf "/tmp/${archive}" -C /tmp gitleaks
            timeout --kill-after=30s 5m /tmp/gitleaks git --redact --no-banner --exit-code 1 --log-opts=--all .
      - restore_cache:
          keys:
            - portfolio-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - portfolio-pnpm-v1-
      - run:
          name: Installer les dependances verrouillees
          command: |
            timeout --kill-after=30s 2m corepack enable
            timeout --kill-after=30s 5m corepack prepare pnpm@11.17.0 --activate
            test "$(timeout --kill-after=30s 2m pnpm --version)" = "11.17.0"
            timeout --kill-after=30s 10m pnpm install --frozen-lockfile --store-dir /home/circleci/.pnpm-store
      - save_cache:
          key: portfolio-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - /home/circleci/.pnpm-store
      - run:
          name: Tester la politique d audit
          command: timeout --kill-after=30s 2m node --test tools/audit-policy.test.mjs
      - run:
          name: Audits de production et complet
          command: timeout --kill-after=30s 8m node tools/audit-policy.mjs
      - run:
          name: Tests, formatage, lint, types et build
          command: timeout --kill-after=30s 10m pnpm verify
      - run:
          name: Verifier Chromium fourni par l image Playwright
          command: |
            timeout --kill-after=30s 2m node -e '
              const fs = require("node:fs");
              const version = require("@playwright/test/package.json").version;
              if (version !== "1.64.0") throw new Error("Version Playwright inattendue : " + version);
              const { chromium } = require("@playwright/test");
              const executable = chromium.executablePath();
              if (!executable.startsWith("/ms-playwright/")) throw new Error("Chemin Chromium inattendu : " + executable);
              fs.accessSync(executable, fs.constants.X_OK);
              console.log("Chromium image : " + executable);
            '
      - run:
          name: Playwright desktop - SEO et confidentialite - budget 10 min
          command: |
            mkdir -p /tmp/portfolio-playwright/desktop
            E2E_REPORT_DIR=/tmp/portfolio-playwright/desktop \
              timeout --kill-after=30s 10m pnpm exec playwright test \
              e2e/seo-i18n.spec.ts e2e/contact-security.spec.ts e2e/contact-qualification.spec.ts \
              --project=desktop-chromium --workers=1 --global-timeout=570000 \
              --output=/tmp/portfolio-playwright/desktop/failures
      - store_test_results:
          path: /tmp/portfolio-playwright/desktop/junit.xml
      - store_artifacts:
          path: /tmp/portfolio-playwright/desktop
          destination: playwright-desktop
      - run:
          name: Playwright Android - SEO et confidentialite - budget 10 min
          when: always
          command: |
            test -d node_modules
            test -d dist
            mkdir -p /tmp/portfolio-playwright/android
            E2E_REPORT_DIR=/tmp/portfolio-playwright/android \
              timeout --kill-after=30s 10m pnpm exec playwright test \
              e2e/seo-i18n.spec.ts e2e/contact-security.spec.ts e2e/contact-qualification.spec.ts \
              --project=android-chromium --workers=1 --global-timeout=570000 \
              --output=/tmp/portfolio-playwright/android/failures
      - store_test_results:
          path: /tmp/portfolio-playwright/android/junit.xml
      - store_artifacts:
          path: /tmp/portfolio-playwright/android
          destination: playwright-android

workflows:
  portfolio-checks:
    jobs:
      - verify
