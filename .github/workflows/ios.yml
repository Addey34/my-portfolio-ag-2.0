name: Appareils réels

# Lancé à la main : l'offre BrowserStack gratuite est limitée à 100 minutes.
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL du site à tester
        default: https://adrianguichard.dev/
        required: false

permissions:
  contents: read

concurrency:
  group: portfolio-devices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  devices:
    name: iPhone et Android réels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Parcours sur appareils réels
        run: pnpm test:ios
        env:
          IOS_BASE_URL: ${{ inputs.url }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
