name: Lighthouse CI

# Garde-fou perf automatique : à chaque push/PR, on build et on mesure. Le budget
# (LCP, CLS, TBT, a11y) vit dans lighthouserc.json. CLS et a11y font échouer le job ;
# la perf reste en « warn » (le rendu WebGL headless est pénalisé et peu représentatif).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.14.x autorun
